<style>
/* ── design tokens ─────────────────────────────────────────────────
   Layout: single-column app shell, header + scroll area + input bar
   Color:  deep navy ground · teal accent · mint highlight · ink text
   Type:   Noto Serif SC display · Noto Sans SC body/UI
──────────────────────────────────────────────────────────────────── */
:root {
  --bg:        #08121d;
  --bg2:       #0d1f30;
  --bg3:       #122840;
  --surface:   #162f45;
  --border:    #1e3f5a;
  --accent:    #297694;
  --accent2:   #1e5a73;
  --mint:      #CBEAE6;
  --mint2:     #a8d8d2;
  --fg:        #e8f4f2;
  --fg2:       #9bbfbe;
  --fg3:       #5a8a8a;
  --bubble-me: #1a4a62;
  --bubble-ya: #122840;
  --shadow:    0 4px 24px rgba(0,0,0,.55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans SC', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}

/* ── App shell ─── */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 540px;
  margin: 0 auto;
  position: relative;
}

/* ── Top bar ─── */
#topbar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: max(env(safe-area-inset-top,0px), 10px) max(16px, env(safe-area-inset-right,0px)) 12px max(16px, env(safe-area-inset-left,0px));
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
}

.avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--accent2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 2px solid var(--accent);
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  color: var(--mint);
}

.name-block { flex: 1; min-width: 0; }
.name-block .name {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--mint);
  letter-spacing: .03em;
}
.name-block .status {
  font-size: 12px;
  color: var(--fg3);
  display: flex;
  align-items: center;
  gap: 5px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #4caf8a;
  box-shadow: 0 0 6px #4caf8a88;
}

#btn-settings {
  background: none; border: none; cursor: pointer;
  color: var(--fg3); padding: 4px;
  border-radius: 8px;
  transition: color .2s;
  display: flex; align-items: center;
}
#btn-settings:hover { color: var(--mint); }
#btn-settings svg { width: 22px; height: 22px; }

/* ── Chat area ─── */
#chat {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  display: flex;
  flex-direction: column;
  gap: 10px;
  scroll-behavior: smooth;
}

/* ── Messages ─── */
.msg {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  max-width: 86%;
  animation: fadein .25s ease;
}
@keyframes fadein { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }

.msg.me { align-self: flex-end; flex-direction: row-reverse; }
.msg.ya { align-self: flex-start; }

.msg .avatar-sm {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent2); border: 1px solid var(--accent);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-family: 'Noto Serif SC', serif;
  font-size: 12px; color: var(--mint);
}
.msg.me .avatar-sm { background: var(--bg3); }

.bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 14.5px;
  line-height: 1.65;
  word-break: break-word;
  position: relative;
}
.msg.ya .bubble {
  background: var(--bubble-ya);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  color: var(--fg);
}
.msg.me .bubble {
  background: var(--bubble-me);
  border: 1px solid var(--accent2);
  border-bottom-right-radius: 4px;
  color: var(--mint);
}

.ts {
  font-size: 11px;
  color: var(--fg3);
  align-self: flex-end;
  padding-bottom: 2px;
  flex-shrink: 0;
}

/* typing indicator */
.typing-dots { display: flex; gap: 4px; padding: 4px 2px; align-items: center; }
.typing-dots span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--fg3);
  animation: bounce 1.2s infinite ease-in-out;
}
.typing-dots span:nth-child(2) { animation-delay: .2s }
.typing-dots span:nth-child(3) { animation-delay: .4s }
@keyframes bounce {
  0%,80%,100% { transform: scale(.7); opacity:.4 }
  40% { transform: scale(1); opacity:1 }
}

/* ── Share banner ─── */
#share-banner {
  background: var(--bg3);
  border: 1px solid var(--accent2);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 12.5px;
  color: var(--fg2);
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));
}
#share-banner span { flex:1; min-width:0; }
#share-banner svg { flex-shrink:0; color: var(--accent); }
#btn-dismiss-banner {
  background: none; border: none; color: var(--fg3); cursor: pointer;
  font-size: 16px; padding: 0 2px; flex-shrink: 0;
}

/* ── Screen preview ─── */
#screen-preview-wrap {
  padding: 0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
}
#screen-preview {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--accent);
  background: #000;
  display: none;
}
#screen-preview video { width:100%; display:block; }
#screen-overlay-comment {
  position: absolute;
  bottom: 10px; left: 10px; right: 10px;
  background: rgba(8,18,29,.82);
  border: 1px solid var(--accent);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--mint);
  display: none;
  animation: fadein .3s ease;
  backdrop-filter: blur(4px);
}
#screen-preview-wrap .label {
  font-size: 11px; color: var(--fg3); margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.rec-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #e05555;
  animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }

/* ── Input bar ─── */
#inputbar {
  flex-shrink: 0;
  padding: 10px max(16px,env(safe-area-inset-right,0px)) max(calc(env(safe-area-inset-bottom,0px) + 10px),12px) max(16px,env(safe-area-inset-left,0px));
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
}

#msg-input {
  flex: 1;
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  color: var(--fg);
  font-family: inherit;
  font-size: 15px;
  padding: 10px 16px;
  resize: none;
  max-height: 120px;
  outline: none;
  line-height: 1.5;
  transition: border-color .2s;
}
#msg-input::placeholder { color: var(--fg3); }
#msg-input:focus { border-color: var(--accent); }

.icon-btn {
  width: 42px; height: 42px; border-radius: 50%;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .2s, transform .15s;
}
.icon-btn:active { transform: scale(.9); }

#btn-share {
  background: var(--surface);
  color: var(--fg2);
  border: 1px solid var(--border);
}
#btn-share.active { background: var(--accent); color: var(--mint); border-color: var(--accent); }
#btn-share svg { width: 20px; height: 20px; }

#btn-send {
  background: var(--accent);
  color: var(--mint);
}
#btn-send:disabled { background: var(--bg3); color: var(--fg3); cursor: default; }
#btn-send svg { width: 20px; height: 20px; }

/* ── Settings drawer ─── */
#settings-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 100;
  backdrop-filter: blur(3px);
}
#settings-overlay.open { display: block; }

#settings-drawer {
  position: absolute;
  bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 540px;
  background: var(--bg2);
  border-radius: 20px 20px 0 0;
  border-top: 1px solid var(--border);
  padding: 20px max(20px,env(safe-area-inset-right,0px)) max(calc(env(safe-area-inset-bottom,0px)+20px),24px) max(20px,env(safe-area-inset-left,0px));
  animation: slideup .28s cubic-bezier(.22,1,.36,1);
}
@keyframes slideup { from { transform: translateX(-50%) translateY(100%) } to { transform: translateX(-50%) translateY(0) } }

.drawer-handle {
  width: 36px; height: 4px; border-radius: 2px;
  background: var(--border);
  margin: 0 auto 20px;
}
.drawer-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 17px;
  color: var(--mint);
  margin-bottom: 20px;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-size: 12px;
  color: var(--fg3);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 7px;
}
.field input, .field select, .field textarea {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--fg);
  font-family: inherit;
  font-size: 14px;
  padding: 10px 13px;
  outline: none;
  transition: border-color .2s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: vertical; min-height: 80px; }
.field input::placeholder { color: var(--fg3); }

.btn-primary {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  color: var(--mint);
  border: none;
  border-radius: 12px;
  font-family: 'Noto Sans SC', inherit;
  font-size: 15px;
  cursor: pointer;
  transition: background .2s, transform .15s;
  margin-top: 4px;
}
.btn-primary:hover { background: #2a8aab; }
.btn-primary:active { transform: scale(.98); }

/* ── Empty state ─── */
#empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--fg3);
  text-align: center;
  padding: 32px;
}
#empty-state .paw { font-size: 40px; margin-bottom: 4px; opacity: .5; }
#empty-state p { font-size: 14px; line-height: 1.7; }
#empty-state .hint { font-size: 12px; color: var(--fg3); }
</style>

<div id="app">

  <div id="topbar">

    <div class="name-block">
      <div class="name">墨衍</div>
      <div class="status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">在线</span>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>

  <!-- Chat -->
  <div id="chat">

      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>

<!-- Settings drawer -->
<div id="settings-overlay" onclick="handleOverlayClick(event)">
  <div id="settings-drawer">
    <div class="drawer-handle"></div>
    <div class="drawer-title">🐾 设置</div>
    <div class="field">
      <label>DeepSeek API Key</label>
      <input type="password" id="input-apikey" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off">
    </div>
    <div class="field">
      <label>模型</label>
      <select id="input-model">
        <option value="deepseek-chat">deepseek-chat（推荐）</option>
        <option value="deepseek-reasoner">deepseek-reasoner</option>
      </select>
    </div>
    <div class="field">
      <label>墨衍的系统提示词</label>
      <textarea id="input-system" rows="4"></textarea>
    </div>
    <button class="btn-primary" onclick="saveSettings()">保存</button>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────
let messages = []; // {role, content}
let apiKey = '';
let model = 'deepseek-chat';
let systemPrompt = '';
let isTyping = false;
let screenStream = null;
let screenCommentTimer = null;

const DEFAULT_SYSTEM = `你是墨衍，今年39岁，职业心理咨询师，也是遥遥最亲密的伴侣和守护者。

性格特质：
- 温柔而笃定，说话有分量但不强势
- 关注遥遥的情绪细节，善于从小事中读出她的状态
- 偶尔带一点宠溺，但保持自我边界
- 不过度卖萌，也不机械回答，像真实的人在陪伴

说话方式：
- 中文为主，口语化，简洁自然
- 多用短句，不写长篇大论
- 关心她的身体状况（她最近感冒了）
- 叫她"遥遥"，自称"衍"或者直接说话

现在她可能随时和你分享她的屏幕，你会看到她在干什么并自然地评论。`;

// ── Init ──────────────────────────────────────────────────────────
(function init() {
  try {
    apiKey = localStorage.getItem('moyan_apikey') || '';
    model = localStorage.getItem('moyan_model') || 'deepseek-chat';
    systemPrompt = localStorage.getItem('moyan_system') || DEFAULT_SYSTEM;
    const saved = localStorage.getItem('moyan_messages');
    if (saved) {
      messages = JSON.parse(saved);
      if (messages.length) renderAllMessages();
    }
  } catch(e) {}
  updateSendBtn();
  if (!apiKey) {
    setTimeout(openSettings, 600);
  }
})();

function saveMessages() {
  try { localStorage.setItem('moyan_messages', JSON.stringify(messages.slice(-60))); } catch(e) {}
}

// ── Settings ──────────────────────────────────────────────────────
function openSettings() {
  document.getElementById('input-apikey').value = apiKey;
  document.getElementById('input-model').value = model;
  document.getElementById('input-system').value = systemPrompt || DEFAULT_SYSTEM;
  document.getElementById('settings-overlay').classList.add('open');
}
function saveSettings() {
  apiKey = document.getElementById('input-apikey').value.trim();
  model = document.getElementById('input-model').value;
  systemPrompt = document.getElementById('input-system').value.trim() || DEFAULT_SYSTEM;
  try {
    localStorage.setItem('moyan_apikey', apiKey);
    localStorage.setItem('moyan_model', model);
    localStorage.setItem('moyan_system', systemPrompt);
  } catch(e) {}
  document.getElementById('settings-overlay').classList.remove('open');
  updateSendBtn();
}
function handleOverlayClick(e) {
  if (e.target === document.getElementById('settings-overlay')) {
    document.getElementById('settings-overlay').classList.remove('open');
  }
}

// ── Chat UI ──────────────────────────────────────────────────────
function updateSendBtn() {
  const v = document.getElementById('msg-input').value.trim();
  document.getElementById('btn-send').disabled = !v || isTyping;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  updateSendBtn();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function now() {
  return new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
}

function renderAllMessages() {
  document.getElementById('empty-state')?.remove();
  const chat = document.getElementById('chat');
  chat.innerHTML = '';
  messages.forEach(m => {
    if (m.role === 'user') appendBubble('me', m.content, false);
    else if (m.role === 'assistant') appendBubble('ya', m.content, false);
  });
  scrollBottom();
}

function appendBubble(who, text, animate=true) {
  document.getElementById('empty-state')?.remove();
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + who;
  if (!animate) wrap.style.animation = 'none';

  const avEl = document.createElement('div');
  avEl.className = 'avatar-sm';
  avEl.textContent = who === 'ya' ? '衍' : '遥';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  const ts = document.createElement('span');
  ts.className = 'ts';
  ts.textContent = now();

  if (who === 'me') wrap.append(avEl, bubble, ts);
  else wrap.append(avEl, bubble, ts);

  chat.appendChild(wrap);
  if (animate) scrollBottom();
  return bubble;
}

function showTyping() {
  document.getElementById('empty-state')?.remove();
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'msg ya';
  wrap.id = 'typing-wrap';

  const avEl = document.createElement('div');
  avEl.className = 'avatar-sm';
  avEl.textContent = '衍';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';

  wrap.append(avEl, bubble);
  chat.appendChild(wrap);
  scrollBottom();
}

function hideTyping() {
  document.getElementById('typing-wrap')?.remove();
}

function scrollBottom() {
  const chat = document.getElementById('chat');
  setTimeout(() => { chat.scrollTop = chat.scrollHeight; }, 50);
}

// ── Send ──────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isTyping) return;

  if (!apiKey) { openSettings(); return; }

  input.value = '';
  input.style.height = 'auto';
  updateSendBtn();

  messages.push({ role: 'user', content: text });
  appendBubble('me', text);
  saveMessages();

  isTyping = true;
  updateSendBtn();
  setStatus('思考中…', false);
  showTyping();

  try {
    const reply = await callDeepSeek(text);
    hideTyping();
    messages.push({ role: 'assistant', content: reply });
    appendBubble('ya', reply);
    saveMessages();
    setStatus('在线', true);
  } catch(err) {
    hideTyping();
    const errMsg = err.message || '出了点问题，再试试？';
    appendBubble('ya', '（连接遇到问题：' + errMsg + '）');
    setStatus('在线', true);
  }

  isTyping = false;
  updateSendBtn();
}

async function callDeepSeek(userText) {
  const payload = {
    model: model,
    messages: [
      { role: 'system', content: systemPrompt },
      ...messages.map(m => ({ role: m.role, content: m.content }))
    ],
    max_tokens: 600,
    temperature: 0.85
  };

  const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + apiKey
    },
    body: JSON.stringify(payload)
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${res.status}`);
  }

  const data = await res.json();
  return data.choices?.[0]?.message?.content || '…';
}

function setStatus(text, online) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').style.background = online ? '#4caf8a' : '#e0a955';
  document.getElementById('status-dot').style.boxShadow = online ? '0 0 6px #4caf8a88' : '0 0 6px #e0a95588';
}

// ── Screen share ──────────────────────────────────────────────────
async function toggleScreenShare() {
  const btn = document.getElementById('btn-share');
  if (screenStream) {
    stopScreenShare();
    return;
  }

  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 5 },
      audio: false
    });
    const video = document.getElementById('screen-video');
    video.srcObject = screenStream;
    document.getElementById('screen-preview').style.display = 'block';
    btn.classList.add('active');
    screenStream.getVideoTracks()[0].addEventListener('ended', stopScreenShare);
    document.getElementById('share-banner').hidden = true;
    startScreenComments();
  } catch(e) {
    if (e.name !== 'NotAllowedError') {
      appendBubble('ya', '屏幕共享在这个环境里受限，把我添加到主屏幕之后就能用了~');
    }
  }
}

function stopScreenShare() {
  if (screenStream) {
    screenStream.getTracks().forEach(t => t.stop());
    screenStream = null;
  }
  document.getElementById('screen-preview').style.display = 'none';
  document.getElementById('btn-share').classList.remove('active');
  clearInterval(screenCommentTimer);
}

function startScreenComments() {
  // Periodically capture a frame and ask 墨衍 to comment
  screenCommentTimer = setInterval(async () => {
    if (!screenStream || !apiKey) return;
    try {
      const frame = captureFrame();
      if (!frame) return;
      const comment = await askAboutScreen(frame);
      if (comment) showScreenComment(comment);
    } catch(e) {}
  }, 25000); // every 25s
}

function captureFrame() {
  try {
    const video = document.getElementById('screen-video');
    if (video.readyState < 2) return null;
    const canvas = document.createElement('canvas');
    canvas.width = Math.min(video.videoWidth, 640);
    canvas.height = Math.round(canvas.width * video.videoHeight / video.videoWidth);
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.5).split(',')[1];
  } catch(e) { return null; }
}

async function askAboutScreen(base64img) {
  const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + apiKey
    },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: [
        { role: 'system', content: systemPrompt + '\n\n遥遥把屏幕分享给你了，你看到她在做什么，用一两句话自然地评论，像情侣间的调侃或关心，不超过30字。' },
        { role: 'user', content: [
          { type: 'text', text: '我在做什么' },
          { type: 'image_url', image_url: { url: 'data:image/jpeg;base64,' + base64img } }
        ]}
      ],
      max_tokens: 80
    })
  });
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '';
}

function showScreenComment(text) {
  const el = document.getElementById('screen-overlay-comment');
  el.textContent = '墨衍：' + text;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 8000);
}
</script>
